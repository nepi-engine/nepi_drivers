driver:
  pkg_name: LSX_SETTINGS_TEST
  display_name: Settings Test Driver
  description: Temporary test fixture. Exposes one setting of every nepi_controls
    control type plus one Discrete setting, connects to no hardware, and serves a
    live read-back page so a silently dropped setting is visible. Delete after use.
  type: LSX
  group_id: None
  NODE_DICT:
    file_name: lsx_settings_test_node.py
    class_name: SettingsTestNode
  DRIVER_DICT:
    file_name: None
    class_name: None
  DISCOVERY_DICT:
    file_name: lsx_settings_test_discovery.py
    class_name: SettingsTestDiscovery
    process: CALL
    OPTIONS:
      # page_port is the one functional option -- the node reads it back to pick
      # its HTTP port. Everything below it is a type probe and drives nothing.
      #
      # Every option MUST carry an 'options' key, even where the type ignores it:
      # drivers_mgr.initDiscoverySettingsDict() reads setting['options']
      # unconditionally (drivers_mgr.py:890), so an option without it raises
      # KeyError and takes the whole driver's option panel down with it.
      # Use [] for the types that have no option list; do NOT use a one-element
      # list, because a single entry is looked up in drivers_mgr's
      # setting_options_dict expansion table (SERIAL_DEVICES etc.) at line 960.
      #
      # For Int and Float, 'options' is a [min, max] pair that drivers_mgr turns
      # into control bounds via set_control_bounds() at line 978 -- it is NOT a
      # choice list. That conversion is applied to Int and Float only, so the
      # FloatSlider entries below deliberately test what happens to a slider type
      # that never gets its bounds installed.
      page_port:
        type: 'Int'
        options:
          - '1024'
          - '65535'
        default: '5010'
        value: '5010'
      opt_menu:
        type: 'Menu'
        options:
          - 'option_a'
          - 'option_b'
          - 'option_c'
        default: 0
        value: 0
      opt_selection:
        type: 'Selection'
        options:
          - 'option_a'
          - 'option_b'
          - 'option_c'
        default: 'option_a'
        value: 'option_a'
      opt_discrete:
        type: 'Discrete'
        options:
          - 'option_a'
          - 'option_b'
          - 'option_c'
        default: 'option_a'
        value: 'option_a'
      opt_selections:
        type: 'Selections'
        options:
          - 'option_a'
          - 'option_b'
          - 'option_c'
        default:
          - 'option_a'
        value:
          - 'option_a'
      opt_selections_dd:
        type: 'SelectionsDD'
        options:
          - 'option_a'
          - 'option_b'
          - 'option_c'
          - 'option_d'
          - 'option_e'
          - 'option_f'
        default:
          - 'option_a'
        value:
          - 'option_a'
      opt_trigger:
        type: 'Trigger'
        options: []
        default: 'None'
        value: 'None'
      opt_bool:
        type: 'Bool'
        options: []
        default: 'False'
        value: 'False'
      opt_string:
        type: 'String'
        options: []
        default: 'hello'
        value: 'hello'
      opt_int:
        type: 'Int'
        options:
          - '0'
          - '100'
        default: '50'
        value: '50'
      opt_float:
        type: 'Float'
        options:
          - '0.0'
          - '1.0'
        default: '0.5'
        value: '0.5'
      opt_float_slider:
        type: 'FloatSlider'
        options:
          - '0.0'
          - '1.0'
        default: '0.25'
        value: '0.25'
      opt_float_sliders:
        type: 'FloatSliders'
        options:
          - '0.0'
          - '1.0'
        default:
          - '0.25'
          - '0.75'
        value:
          - '0.25'
          - '0.75'
